<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Junglizer</title>
<meta name="theme-color" content="#171914">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/consent.css">
<!-- Google Analytics loads only after the visitor accepts; see assets/consent.js -->
<script src="/assets/consent.js" defer></script>
<style>
  :root {
    --canvas: #171914;
    --surface: #22251d;
    --well: #10120f;
    --edge: #4c513d;
    --ink: #f4f1de;
    --muted: #abb29a;
    --accent: #d3e080;
    --b1: #ee9757;
    --b2: #69cdc1;
    --b3: #97adf1;
    --b4: #de8bbe;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font: 17px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:hover { color: var(--ink); }
  img { max-width: 100%; height: auto; display: block; }
  code {
    font: 0.88em ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--well);
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 1px 5px;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  .bars { display: grid; grid-template-columns: repeat(4, 1fr); height: 6px; }
  .bars span:nth-child(1) { background: var(--b1); }
  .bars span:nth-child(2) { background: var(--b2); }
  .bars span:nth-child(3) { background: var(--b3); }
  .bars span:nth-child(4) { background: var(--b4); }

  header.top { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; font-size: 15px; }
  header.top .brand { display: block; width: 180px; }
  header.top nav a { color: var(--ink); text-decoration: none; }
  header.top nav a:hover { color: var(--accent); }

  main { padding: 40px 0 72px; }
  h1 { font-size: clamp(30px, 4vw, 40px); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .updated { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
  .summary {
    margin: 28px 0 24px; padding: 18px 20px; border-radius: 6px;
    background: var(--well); border: 1px solid var(--edge); font-size: 18px;
  }
  h2 { font-size: 21px; line-height: 1.3; margin: 44px 0 8px; }
  p, li { color: var(--muted); }
  main p { margin: 0 0 14px; }
  main strong { color: var(--ink); }
  ul { margin: 0 0 14px; padding-left: 1.2em; }
  li { margin: 4px 0; }

  footer { border-top: 1px solid var(--surface); padding: 32px 0 48px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
  footer .legal { display: flex; gap: 20px; align-items: center; }
  footer .legal a { display: inline-flex; align-items: center; min-height: 44px; }

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .wrap { padding: 0 16px; }
    header.top .brand { width: 140px; }
    main { padding-top: 24px; }
  }
</style>
</head>
<body>
<div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<div class="wrap">
  <header class="top">
    <a class="brand" href="/"><picture>
      <source srcset="/img/wordmark.webp" type="image/webp">
      <img src="/img/wordmark.png" width="1400" height="351" alt="Junglizer home">
    </picture></a>
    <nav><a href="/#download">Download</a></nav>
  </header>
</div>

<main class="wrap">
  <h1>Page not found</h1>
  <p>There’s nothing at this address. It may have moved, or the link may have a typo.</p>
  <p><a href="/">Go to the Junglizer home page</a> or <a href="/#download">download the beta</a>.</p>

<footer>
  <div class="wrap">
    <span>Junglizer by <a href="https://mrballistic.com">mrballistic</a></span>
    <nav class="legal" aria-label="Legal">
      <a href="/privacy/">Privacy</a>
      <button type="button" class="consent-open" data-consent-open>Cookie settings</button>
    </nav>
  </div>
</footer>
</body>
</html>
