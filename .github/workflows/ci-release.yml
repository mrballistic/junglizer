name: CI and beta release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked

  bundles:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - name: Install Truce build tool
        run: cargo install cargo-truce --version 6.3.0 --locked
      - name: Build AUv2, VST3, and CLAP
        run: cargo truce build --au2 --vst3 --clap
      - name: Pack each format
        shell: bash
        run: |
          mkdir -p dist
          for format in component vst3 clap; do
            ditto -c -k --sequesterRsrc --keepParent "target/bundles/Junglizer.$format" "dist/Junglizer-${GITHUB_REF_NAME}-${{ matrix.arch }}-$format.zip"
          done
          (cd dist && shasum -a 256 *.zip > "SHA256-${{ matrix.arch }}.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - name: Publish beta with six plugin archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --prerelease \
            --title "Junglizer 0.9 beta 1" \
            --notes-file docs/RELEASE-NOTES-0.9.0-beta.1.md
