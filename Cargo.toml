[package]
name = "junglizer"
version = "0.9.3-beta.4"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/mrballistic/junglizer"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "junglizer-standalone"
path = "src/main.rs"
required-features = ["standalone"]

# Scaffolded default: CLAP + VST3 + standalone. To add LV2 / AU / AAX / VST2,
# add the matching feature + optional dep below (e.g.
# `lv2 = ["dep:truce-lv2"]` +
# `truce-lv2 = { version = "6.3", optional = true }`).
# Each format feature gates the matching wrapper crate as an optional
# dep.
[features]
default = ["clap", "vst3", "au", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]
# Flags any allocation your DSP makes on the audio thread in `process`.
# Dev/test only: `cargo test --features rt-paranoid`. Off, zero-cost by
# default.
rt-paranoid = ["truce/rt-paranoid"]
# Appends drag/drop and file-dialog traces to
# ~/Library/Logs/Junglizer/debug.log. Diagnostics only; never ship it:
# `cargo truce build --au2 --features debug-log`.
debug-log = ["truce-egui/debug-log"]

[dependencies]
truce = { version = "6.3" }
# Lightweight types for layout / theme / widget descriptions.
truce-gui-types = { version = "6.3" }
# Built-in renderer. Plugins that supply their own editor (egui /
# iced / slint) can drop this dep.
truce-gui = { version = "6.3" }
truce-egui = { version = "6.3" }
egui = "0.34"
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
truce-au = { version = "6.3", optional = true }
truce-standalone = { version = "6.3", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }
png = "0.18"
crossbeam-queue = "0.3"
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "mp3"] }
dirs = "7"

# The file dialog (file_picker.rs): rfd on Windows and Linux; a non-modal
# NSOpenPanel on macOS, because Logic hosts the editor out of process,
# where rfd's blocking runModal tears down the remote view.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }

# Custom profile for `cargo truce install --shell`. The shell-mode
# build (`cargo build --profile shell --features ...,shell`) lands the
# shell binary at `target/shell/lib<crate>.dylib`, independent of
# `target/release/` (where regular `cargo build --release` writes) and
# `target/debug/` (where `cargo build` writes). Inherits release for
# DSP perf parity.
[profile.shell]
inherits = "release"

[dev-dependencies]
hound = "3.5"

# Vendored, patched copy of truce-egui 6.3.0 that forwards baseview's file
# drag-and-drop events to egui (upstream drops them). See
# vendor/truce-egui/src/editor.rs ("junglizer patch: file drop") and
# docs/upstream/truce-egui-file-drop.md. Remove once upstream ships the fix.
[patch.crates-io]
truce-egui = { path = "vendor/truce-egui" }
# Vendored, patched copy of baseview-truce 0.1.1-truce.13: macOS drag
# positions were reported in window coordinates (Y mirrored), so drops
# missed their targets. See vendor/baseview-truce/src/macos/view.rs
# ("junglizer patch: drag position"). Remove once upstream ships the fix.
baseview-truce = { path = "vendor/baseview-truce" }
